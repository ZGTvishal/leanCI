
[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "leanci"
version = "0.1.0"
description = "A lightweight CLI for detecting performance regressions in Python APIs."
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["httpx>=0.28"]

[tool.setuptools.packages.find]
where = ["src"]